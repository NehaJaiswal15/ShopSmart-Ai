name: Continuous Integration

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      ASTRA_DB_API_ENDPOINT: "https://dummy-endpoint.apps.astra.datastax.com"
      ASTRA_DB_APPLICATION_TOKEN: "AstraCS:dummy-token"
      ASTRA_DB_KEYSPACE: "dummy_keyspace"
      GROQ_API_KEY: "gsk_dummy_api_key"

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
        cache: "pip" # cache pip dependencies automatically

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Ruff Linter
      run: |
        ruff check .

    - name: Run Ruff Formatter Check
      run: |
        ruff format --check .

    - name: Run Unit Tests
      run: |
        pytest tests/ -v
